name: Validate and deploy Project Planner Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete Project Planner tests
        run: node --test tests/*.test.mjs
      - name: Validate JavaScript syntax
        run: find docs -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Check public assets and original UI
        run: python3 tests/check_assets.py
      - name: Verify public Supabase configuration
        run: python3 scripts/verify_public.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site for Pages deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
  deploy:
    needs: validate-and-upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allow GitHub Pages artifact indexing
        run: sleep 12
      - id: deployment
        uses: actions/deploy-pages@v4
